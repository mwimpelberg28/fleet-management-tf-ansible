---
- name: Install and configure Grafana Alloy with Fleet Management remotecfg (Windows)
  hosts: windows
  gather_facts: true

  vars_files:
    - vars/main.yml
    - vars/secrets.yml

  vars:
    alloy_version: "1.5.1"
    alloy_installer_url: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy-installer-windows-amd64.exe.zip"
    alloy_installer_zip: 'C:\Windows\Temp\alloy-installer.zip'
    alloy_installer_dir: 'C:\Windows\Temp\alloy-installer'
    alloy_installer_exe: 'C:\Windows\Temp\alloy-installer\alloy-installer-windows-amd64.exe'
    alloy_install_dir: 'C:\Program Files\GrafanaLabs\Alloy'
    alloy_config_file: 'C:\Program Files\GrafanaLabs\Alloy\config.alloy'
    alloy_data_dir: 'C:\ProgramData\GrafanaLabs\Alloy\data'
    alloy_service_name: Alloy

  tasks:

    # 1. Download installer
    - name: Download Alloy Windows installer zip
      ansible.windows.win_get_url:
        url: "{{ alloy_installer_url }}"
        dest: "{{ alloy_installer_zip }}"
        force: false

    # 2. Extract (uses built-in Expand-Archive — no extra collection needed)
    - name: Extract Alloy installer
      ansible.windows.win_shell: |
        Expand-Archive -Path "{{ alloy_installer_zip }}" -DestinationPath "{{ alloy_installer_dir }}" -Force
      args:
        creates: "{{ alloy_installer_exe }}"

    # 3. Install (NSIS silent flag)
    - name: Install Grafana Alloy
      ansible.windows.win_package:
        path: "{{ alloy_installer_exe }}"
        arguments: /S
        state: present
        creates_path: "{{ alloy_install_dir }}\\alloy-windows-amd64.exe"

    # 4. Ensure data dir exists
    - name: Ensure Alloy data directory exists
      ansible.windows.win_file:
        path: "{{ alloy_data_dir }}"
        state: directory

    # 5. Deploy remotecfg config (env values baked in via Jinja)
    - name: Deploy Alloy remotecfg configuration
      ansible.windows.win_template:
        src: templates/config.alloy.j2
        dest: "{{ alloy_config_file }}"
      notify: Restart Alloy

    # 6. Ensure service is set to auto-start and running
    - name: Configure Alloy service
      ansible.windows.win_service:
        name: "{{ alloy_service_name }}"
        start_mode: auto
        state: started

  handlers:
    - name: Restart Alloy
      ansible.windows.win_service:
        name: "{{ alloy_service_name }}"
        state: restarted
